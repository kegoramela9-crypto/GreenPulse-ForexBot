name: Build GreenPulse Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android project
        shell: bash
            - name: Check Android project
      shell: bash
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew is missing in root directory"
          exit 1
        fi
        chmod +x gradlew
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: cd GreenPulseAndroid && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GreenPulseAndroid/app/build/outputs/apk/debug/app-debug.apk
